{% load static %}
<div class="song-card"
     data-song-id="{{ song.id }}"
     data-title="{{ song.title }}"
     data-artist="{{ song.artist.name }}"
     data-audio="{{ song.audio_file.url }}"
     data-cover="{% if song.get_cover_url %}{{ song.get_cover_url }}{% endif %}">
  <div class="song-card-art">
    {% if song.get_cover_url %}
      <img src="{{ song.get_cover_url }}" alt="{{ song.title }}" loading="lazy">
    {% else %}
      <div class="art-fallback">&#9835;</div>
    {% endif %}
    <button class="play-overlay-btn" aria-label="Play {{ song.title }}">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>
  <p class="song-card-title">{{ song.title }}</p>
  <p class="song-card-artist">{{ song.artist.name }}</p>
</div>
